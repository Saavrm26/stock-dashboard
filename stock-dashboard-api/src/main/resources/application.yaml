spring:
  application:
    name: stock-dashboard-api
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_URL}
    username: ${DB_USER}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true


  security:
    oauth2:
      client:
        registration:
          cognito:
            client-id: 16ofjif7lj3if2d2ncfjgbk6k4
#            client-secret: "client secret"
            scope:
              - phone
              - openid
              - email
              - profile
            # Spring Security by default uses a redirect-uri in the format: {baseUrl}/login/oauth2/code/{registrationId}
            # For example: http://localhost:8080/login/oauth2/code/cognito
            # See more: https://docs.spring.io/spring-security/reference/servlet/oauth2/login/core.html#oauth2login-sample-redirect-uri
            redirect-uri: https://d84l1y8p4kdic.cloudfront.net
        provider:
          cognito:
            issuerUri: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_0bo7lbVvf
            user-name-attribute: username
      resourceserver:
        jwt:
          jwk-set-uri: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_0bo7lbVvf/.well-known/jwks.json
  cloud:
    aws:
      region:
        static: ap-south-1
      secretsmanager:
        reload:
          strategy: restart_context

  threads:
    virtual:
      enabled: true

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        # same-site: strict

  forward-headers-strategy: NATIVE

cors:
  allowed-origins:
    - http://localhost:3000
    - https://ap-south-10bo7lbvvf.auth.ap-south-1.amazoncognito.com

management:
  endpoint:
    restart:
      enabled: true
  endpoints:
    web:
      exposure:
        include: restart

cognito:
  domain: "https://ap-south-10bo7lbvvf.auth.ap-south-1.amazoncognito.com"
  clientId: "16ofjif7lj3if2d2ncfjgbk6k4"
  logoutRedirectUrl: "<logout uri>"

clients:
  stock:
    url: "http://localhost:8081"