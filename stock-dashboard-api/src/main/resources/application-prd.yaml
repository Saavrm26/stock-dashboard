spring:
  config:
    import:
      - "aws-secretsmanager:${AURORA_DB_SECRET_NAME}"
      - aws-parameterstore:/stock-dashboard/prod/cognito

  datasource:
    # This is wrong, currently. we will also need global pem file
    url: "jdbc:postgresql://${DB_URL}?sslmode=verify-full&sslrootcert=/etc/aurora-cacrts/global-bundle.pem"
    username: ${DB_USER}
    password: "${password}"

  jpa:
    show-sql: false

  session:
    store-type: redis

  data:
    redis:
      host: redis-headless
      port: 6379

  security:
    oauth2:
      client:
        registration:
          cognito:
            client-secret: "${client-secret}"
            client-id: 5mbjl33nlff1e5tq82frla5oi6
            redirect-uri: https://stocks-api.saarthakdevelopsstuff.xyz/login/oauth2/code/cognito
        provider:
          cognito:
            issuerUri: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_KnXPlAcdz
      resourceserver:
        jwt:
          jwk-set-uri: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_KnXPlAcdz/.well-known/jwks.json

cognito:
  domain: https://ap-south-1knxplacdz.auth.ap-south-1.amazoncognito.com
  client-id: 5mbjl33nlff1e5tq82frla5oi6
  logoutRedirectUrl: https://stocks.saarthakdevelopsstuff.xyz
  defaultSuccessUrl: https://stocks.saarthakdevelopsstuff.xyz

cors:
  allowed-origins:
    - https://stocks.saarthakdevelopsstuff.xyz
    - https://ap-south-1knxplacdz.auth.ap-south-1.amazoncognito.com