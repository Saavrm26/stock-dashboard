spring:
  config:
    import:
      - "aws-secretsmanager:${AURORA_DB_SECRET_NAME}"
      - aws-parameterstore:/stock-dashboard/prd/cognito

  datasource:
    # This is wrong, currently. we will also need global pem file
    url: "jdbc:postgresql://${DB_URL}?sslmode=verify-full&sslrootcert=/etc/aurora-cacrts/global-bundle.pem"
    username: ${DB_USER}
    password: "${password}"

  jpa:
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          cognito:
            client-secret: "${client-secret}"
            client-id: 2r5efhos59gv3fs6hk59g604c3
            redirect-uri: https://stocks.api.saarthakdevelopsstuff.xyz/login/oauth2/code/cognito
        provider:
          cognito:
            issuerUri: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_KVzxBoBd9
      resourceserver:
        jwt:
          jwk-set-uri: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_KVzxBoBd9/.well-known/jwks.json

cognito:
  domain: https://ap-south-1kvzxbobd9.auth.ap-south-1.amazoncognito.com
  client-id: 2r5efhos59gv3fs6hk59g604c3
  logoutRedirectUrl: https://stocks.api.saarthakdevelopsstuff.xyz
