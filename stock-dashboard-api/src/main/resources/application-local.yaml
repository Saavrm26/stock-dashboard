spring:
  datasource:
    url: jdbc:postgresql://${DB_URL}
    username: ${DB_USER}
    password: postgres

  config:
    import:
      # This has secrets and other configurations
      - aws-parameterstore:/stock-dashboard/local/cognito

  security:
    oauth2:
      client:
        registration:
          cognito:
            client-secret: "${client-secret}"
            redirect-uri: http://localhost:8080/login/oauth2/code/cognito

  jpa:
    show-sql: true

  session:
    store-type: redis

  data:
    redis:
      host: localhost
      port: 6379

server:
  servlet:
    session:
      cookie:
        secure: false

logging:
  level:
    org:
      springframework:
        security: DEBUG
        boot:
          context:
            config: DEBUG
            properties: DEBUG
    xyz.saarthakdevelopsstuff.stock_dashboard_api: DEBUG

cognito:
  defaultSuccessUrl: http://localhost:3000
  logoutRedirectUrl: http://localhost:3000