version: '3.8'

services:
  postgres:
    image: postgres:17-bookworm
    container_name: stock-dashboard-postgres
    environment:
      POSTGRES_DB: stock_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stock-dashboard-network

  redis:
    image: redis:8.2-bookworm
    container_name: stock-dashboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stock-dashboard-network

volumes:
  postgres_data:
  redis_data:

networks:
  stock-dashboard-network:
    driver: bridge
