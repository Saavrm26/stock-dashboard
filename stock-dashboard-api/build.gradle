plugins {
	id 'org.jetbrains.kotlin.jvm' version '2.2.21'
	id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.jetbrains.kotlin.plugin.jpa' version '2.2.21'
    id 'com.google.devtools.ksp' version '2.3.4'
    id "org.jetbrains.kotlin.kapt" version "2.3.10"
    id "com.google.protobuf" version "0.9.6"
}

group = 'xyz.saarthakdevelopsstuff'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.5"
		mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2023.0.3'
		mavenBom 'io.awspring.cloud:spring-cloud-aws-dependencies:3.2.1'
        mavenBom 'com.google.protobuf:protobuf-bom:4.33.5'
	}
}

dependencies {
    // deps from BOMs
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.cloud:spring-cloud-starter'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'com.google.protobuf:protobuf-java'
    implementation 'com.google.protobuf:protobuf-java-util'
    runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Deps not from BOMs
    implementation 'org.flywaydb:flyway-core:11.20.3'
    implementation 'org.mapstruct:mapstruct:1.7.0.Beta1'
    kapt 'org.mapstruct:mapstruct-processor:1.7.0.Beta1'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql:11.20.3'
}

kotlin {
	compilerOptions {
		freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
	}
}

sourceSets {
    main {
        proto {
            srcDir "../common/proto/v1"
        }
    }
    java {}
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.33.5"
    }
}

allOpen {
	annotation 'jakarta.persistence.Entity'
	annotation 'jakarta.persistence.MappedSuperclass'
	annotation 'jakarta.persistence.Embeddable'
    annotation 'org.springframework.boot.context.properties.ConfigurationProperties'
}

tasks.named('test') {
	useJUnitPlatform()
}
