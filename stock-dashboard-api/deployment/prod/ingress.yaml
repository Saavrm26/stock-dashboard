apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stock-dashboard-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:524831447009:certificate/0d81b2bb-62c1-4c16-905b-123af4f35f23
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    external-dns.alpha.kubernetes.io/ttl: "60"
spec:
  ingressClassName: alb
  rules:
    - host: stocks-api.saarthakdevelopsstuff.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stock-dashboard-api-service
                port:
                  number: 80