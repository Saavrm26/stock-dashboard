apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-dashboard-api-deployment
  labels:
    app: stock-dashboard-api

spec:
  template:
    spec:
      serviceAccountName: app-sa
      volumes:
        - name: aurora-cacrts
          configMap:
            name: aurora-cacrts
      containers:
        - name: app
          image: ghcr.io/saavrm26/stock-dashboard/api:latest
          # For debugging
#          command: ["/bin/bash"]
#          args: ["-c", "while true; do echo hello; sleep 10; done"]

          env:
            - name: AURORA_DB_SECRET_NAME
              valueFrom:
                configMapKeyRef:
                  key: aurora_db_secret_name
                  name: infra-config
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  key: db_url
                  name: infra-config
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  key: db_user
                  name: infra-config
          volumeMounts:
            - mountPath: /etc/aurora-cacrts
              name: aurora-cacrts