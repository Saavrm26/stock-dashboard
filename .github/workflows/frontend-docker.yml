name: Build and push frontend image

on:
  push:
    branches: [main]
    paths:
      - "stock-dashboard-frontend/**"
      - "common/**"
      - ".github/workflows/frontend-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: stock-dashboard-frontend
          file: stock-dashboard-frontend/Dockerfile
          build-contexts: common=common
          platforms: linux/amd64
          push: true
          tags: ghcr.io/saavrm26/stock-dashboard/frontend:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://stocks-api.saarthakdevelopsstuff.xyz
          cache-from: type=gha
          cache-to: type=gha,mode=max
