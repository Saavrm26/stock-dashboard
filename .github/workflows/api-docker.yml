name: Build and push API image

on:
  push:
    branches: [main]
    paths:
      - "stock-dashboard-api/**"
      - "common/**"
      - ".github/workflows/api-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: stock-dashboard-api
          file: stock-dashboard-api/Dockerfile
          build-contexts: common=common
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/stock-dashboard/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
