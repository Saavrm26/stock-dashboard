version: 1
applications:
  - appRoot: stock-dashboard-frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - corepack enable
            - corepack prepare yarn@4.9.2 --activate
            - yarn install --immutable
        build:
          commands:
            - yarn build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .yarn/cache/**/*
          - .next/cache/**/*
